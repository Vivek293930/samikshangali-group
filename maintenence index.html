<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samikshanjali Group - Under Maintenance</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    
    <!-- VIP Cursive Font (For Developer Signature) -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .maintenance-box {
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            border-top: 5px solid #e67e22;
        }
        .maintenance-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid #e67e22;
            padding: 2px;
            margin-bottom: 15px;
            background: #fff;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        /* Ashish Bhai ka Developer Credit */
        .developer-credit {
            font-size: 12px;
            color: #333333;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.5;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .developer-credit strong {
            display: block;
            color: #2c3e50;
            font-size: 24px;
            margin-top: 2px;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <img src="logo.jpg" alt="Logo">
        <h1>Samikshanjali Group</h1>
        <p>Our website is currently undergoing scheduled maintenance. We will be back online shortly!</p>
        <div class="badge">Coming Back Soon</div>
        
        <!-- Ashish Credit Added -->
        <div class="developer-credit">
            Designed & Developed by<br>
            <strong>Ashish</strong>
        </div>
    </div>

</body>
</html>
